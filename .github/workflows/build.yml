name: Build JassAI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare project
        run: |
          if [ -f JassAI_Android_Project.zip ]; then
            unzip -o JassAI_Android_Project.zip
          fi

          if [ -f JassAI_Android_Project/settings.gradle ]; then
            cd JassAI_Android_Project
          fi

      - name: Build APK
        run: |
          if [ -f JassAI_Android_Project/settings.gradle ]; then
            cd JassAI_Android_Project
          fi
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JassAI-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
